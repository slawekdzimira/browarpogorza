        var set = function (key, value) {
            var el = document.querySelector('[data-nf="' + key + '"]');
            if (el) el.textContent = value;
        };
        set('title', copy.title);
        set('text', copy.text);
        set('home', copy.home);
        set('beers', copy.beers);
        var home = document.querySelector('[data-nf="home"]');
        var beers = document.querySelector('[data-nf="beers"]');
        if (home) home.href = '/' + code + '/';
        if (beers) beers.href = copy.beersHref;
        document.querySelectorAll('.langswitch__lang').forEach(function (a) {
            a.classList.toggle('is-current', a.getAttribute('hreflang') === copy.lang);
            if (a.getAttribute('hreflang') === copy.lang) a.setAttribute('aria-current', 'page');
        });
    })();
